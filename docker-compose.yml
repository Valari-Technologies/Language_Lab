services:
  db:
    image: postgres:18-alpine
    container_name: languagelab_db
    environment:
      POSTGRES_DB: ${DB_NAME:-languagelab}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: languagelab_backend
    command: sh -c "python manage.py migrate && python manage.py link_seed_accounts && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,db,0.0.0.0,*
      - DB_NAME=${DB_NAME:-languagelab}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - LMS_SYNC_SECRET=${LMS_SYNC_SECRET:?Set LMS_SYNC_SECRET in the root .env file}
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: languagelab_frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend

volumes:
  postgres_data:
