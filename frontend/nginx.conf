server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tells the LMS hub that nginx can stream package files (X-Accel-Redirect); overwrites any client value
        proxy_set_header X-Lmshub-Accel "1";
    }

    # Package files for the LMS hub: only reachable through X-Accel-Redirect after Django checked access
    location /_lmshub_packages/ {
        internal;
        alias /var/www/media/packages/;
        default_type application/octet-stream;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # The page file must be re-checked on every visit, so a new deploy shows up after a refresh or a new login
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Built files carry a hash in their name: a new build is a new file, so the old ones can be kept for long
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
